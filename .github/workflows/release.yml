name: Release LaudUSG

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Tag ou branch do repo privado (brenogbi/laudos-usg) a buildar, ex: v0.2.1"
        required: true
        default: main

permissions:
  contents: write

jobs:
  release:
    strategy:
      fail-fast: false
      # Serial: evita corrida entre jobs ao criar o mesmo release.
      max-parallel: 1
      matrix:
        include:
          - platform: macos-latest
            args: --target aarch64-apple-darwin
            rust-target: aarch64-apple-darwin
          - platform: windows-latest
            args: ''
            rust-target: ''

    runs-on: ${{ matrix.platform }}
    timeout-minutes: 60

    steps:
      - name: Checkout do código privado
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          repository: brenogbi/laudos-usg
          ref: ${{ inputs.ref }}
          token: ${{ secrets.SOURCE_REPO_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '22'
          cache: npm

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          targets: ${{ matrix.rust-target }}

      # SQLCipher (E3) usa OpenSSL embutido (vendored), que no MSVC exige NASM
      # para compilar o assembly. Perl (Strawberry) já vem no runner Windows.
      - name: Install NASM (Windows — OpenSSL do SQLCipher)
        if: matrix.platform == 'windows-latest'
        shell: pwsh
        run: |
          choco install nasm -y --no-progress
          "C:\Program Files\NASM" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: ./src-tauri -> target

      - name: Install frontend deps
        run: npm ci

      - name: Build and release
        uses: tauri-apps/tauri-action@1ddc7b49b13c3038297360482fcb3e058764d7c9 # v0.6.2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ inputs.ref }}
          releaseName: LaudUSG ${{ inputs.ref }}
          releaseBody: |
            ## LaudUSG ${{ inputs.ref }}

            Baixe o instalador para seu sistema:
            - **Windows**: arquivo .msi ou -setup.exe
            - **Mac Apple Silicon (M1/M2/M3)**: arquivo aarch64.dmg
          releaseDraft: false
          # Tags com hífen (ex.: v0.9.0-rc1) saem como PRERELEASE → não entram no
          # canal do updater (o endpoint /releases/latest ignora prereleases).
          prerelease: ${{ contains(inputs.ref, '-') }}
          includeUpdaterJson: true
          args: ${{ matrix.args }}

      - name: Injetar ajuda de liberação no DMG (macOS)
        if: matrix.platform == 'macos-latest'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REF: ${{ inputs.ref }}
        run: |
          set -euo pipefail
          DMG=$(ls src-tauri/target/*/release/bundle/dmg/*.dmg 2>/dev/null | head -1 || true)
          [ -z "$DMG" ] && DMG=$(ls src-tauri/target/release/bundle/dmg/*.dmg | head -1)
          echo "DMG: $DMG"
          hdiutil convert "$DMG" -format UDRW -o rw.dmg
          MNT=$(mktemp -d)
          hdiutil attach rw.dmg -mountpoint "$MNT" -nobrowse
          cp "src-tauri/dmg/Liberar LaudUSG.command" "$MNT/"
          chmod +x "$MNT/Liberar LaudUSG.command"
          cp "src-tauri/dmg/LEIA - Liberar acesso.txt" "$MNT/"
          hdiutil detach "$MNT"
          rm -f "$DMG"; hdiutil convert rw.dmg -format UDZO -o "$DMG"; rm -f rw.dmg
          gh release upload "$REF" "$DMG" --clobber --repo "${{ github.repository }}"

      # PORTABLE (Windows): ZIP com o executável + o marcador `LaudUSG-portatil.txt`.
      # Com o marcador presente, o app grava tudo em `Dados/` ao lado do .exe em vez
      # de %APPDATA% — descompactar e apagar a pasta não deixa rastro no sistema.
      # O .exe solto continua sendo publicado para quem já usa esse formato: sem o
      # marcador ele se comporta como a versão instalada.
      - name: Publicar portable (Windows)
        if: matrix.platform == 'windows-latest'
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REF: ${{ inputs.ref }}
        run: |
          $exe = Get-ChildItem "src-tauri/target/release/*.exe" |
            Where-Object { $_.Name -notlike "*setup*" } |
            Select-Object -First 1
          if (-not $exe) { throw "binário principal não encontrado em target/release" }
          $base = $exe.BaseName -replace ' ', '.'

          # 1) .exe solto (compatibilidade com quem já baixa assim)
          $dest = "${base}_${env:REF}_x64-portable.exe"
          Copy-Item $exe.FullName $dest
          gh release upload "$env:REF" "$dest" --clobber --repo "${{ github.repository }}"

          # 2) ZIP portátil de verdade
          $pasta = "LaudUSG-Portatil"
          New-Item -ItemType Directory -Force -Path $pasta | Out-Null
          Copy-Item $exe.FullName (Join-Path $pasta $exe.Name)
          @"
Este arquivo liga o MODO PORTATIL do LaudUSG.

Enquanto ele existir nesta pasta, o programa grava tudo (laudos, modelos e a
chave de criptografia) na subpasta Dados, aqui do lado - e nada no sistema.
Para levar em pendrive ou usar em computador de terceiro, leve a pasta inteira.
Para remover sem deixar rastro, apague a pasta inteira.

ATENCAO: a subpasta Dados contem os seus laudos. Apagar significa perder.
Faca backup por Configuracoes > Exportar antes de apagar qualquer coisa.

Se este arquivo for removido, o programa volta a gravar na pasta padrao do
sistema (%APPDATA%\com.laudusg.app) e os dados da pasta Dados deixam de ser
usados - continuam aqui, intactos.
"@ | Set-Content -Path (Join-Path $pasta "LaudUSG-portatil.txt") -Encoding UTF8

          $zip = "${base}_${env:REF}_x64-portable.zip"
          Compress-Archive -Path $pasta -DestinationPath $zip -Force
          Write-Host "Portable ZIP: $zip"
          gh release upload "$env:REF" "$zip" --clobber --repo "${{ github.repository }}"
