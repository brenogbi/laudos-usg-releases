name: Release LaudUSG

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Tag ou branch do repo privado (brenogbi/laudos-usg) a buildar, ex: v0.2.1"
        required: true
        default: main

permissions:
  contents: write

jobs:
  release:
    strategy:
      fail-fast: false
      # Serial: evita corrida entre jobs ao criar o mesmo release.
      max-parallel: 1
      matrix:
        include:
          - platform: macos-latest
            args: --target aarch64-apple-darwin
            rust-target: aarch64-apple-darwin
          - platform: windows-latest
            args: ''
            rust-target: ''

    runs-on: ${{ matrix.platform }}
    timeout-minutes: 60

    steps:
      - name: Checkout do código privado
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          repository: brenogbi/laudos-usg
          ref: ${{ inputs.ref }}
          token: ${{ secrets.SOURCE_REPO_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '22'
          cache: npm

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          targets: ${{ matrix.rust-target }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: ./src-tauri -> target

      - name: Install frontend deps
        run: npm ci

      - name: Build and release
        uses: tauri-apps/tauri-action@1ddc7b49b13c3038297360482fcb3e058764d7c9 # v0.6.2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ inputs.ref }}
          releaseName: LaudUSG ${{ inputs.ref }}
          releaseBody: |
            ## LaudUSG ${{ inputs.ref }}

            Baixe o instalador para seu sistema:
            - **Windows**: arquivo .msi ou -setup.exe
            - **Mac Apple Silicon (M1/M2/M3)**: arquivo aarch64.dmg
          releaseDraft: false
          prerelease: false
          includeUpdaterJson: true
          args: ${{ matrix.args }}

      - name: Injetar ajuda de liberação no DMG (macOS)
        if: matrix.platform == 'macos-latest'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REF: ${{ inputs.ref }}
        run: |
          set -euo pipefail
          DMG=$(ls src-tauri/target/*/release/bundle/dmg/*.dmg 2>/dev/null | head -1 || true)
          [ -z "$DMG" ] && DMG=$(ls src-tauri/target/release/bundle/dmg/*.dmg | head -1)
          echo "DMG: $DMG"
          hdiutil convert "$DMG" -format UDRW -o rw.dmg
          MNT=$(mktemp -d)
          hdiutil attach rw.dmg -mountpoint "$MNT" -nobrowse
          cp "src-tauri/dmg/Liberar LaudUSG.command" "$MNT/"
          chmod +x "$MNT/Liberar LaudUSG.command"
          cp "src-tauri/dmg/LEIA - Liberar acesso.txt" "$MNT/"
          hdiutil detach "$MNT"
          rm -f "$DMG"; hdiutil convert rw.dmg -format UDZO -o "$DMG"; rm -f rw.dmg
          gh release upload "$REF" "$DMG" --clobber --repo "${{ github.repository }}"
